    <!-- Prevent theme flash on initial paint (defaults to Cosmic Ink #080B12) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('juniverse-theme');
          var useLight = saved === 'light';
          if (useLight) {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
